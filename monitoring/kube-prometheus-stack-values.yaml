# Values for the kube-prometheus-stack Helm chart (pinned: chart 91.9.0).
#
# RELEASE NAME MUST BE `kube-prometheus-stack`. Prometheus only picks up ServiceMonitors labelled
# `release: <release name>`, and helm/llm-server/values.yaml sets `release: kube-prometheus-stack`.
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --version 91.9.0 --namespace monitoring --create-namespace \
#     -f monitoring/kube-prometheus-stack-values.yaml
#
# Grafana admin password is generated into a Secret, never committed:
#   kubectl -n monitoring get secret kube-prometheus-stack-grafana \
#     -o jsonpath='{.data.admin-password}' | base64 -d
#
# Sizing: the chart sets no requests by default, so the scheduler would treat these pods as free.
# Explicit requests keep the m7i-flex.large budget honest: ~755m CPU per node is left after the
# llm-server pod (1000m) and DaemonSets. Requests below total ~375m CPU cluster-wide plus 25m per
# node for node-exporter.

# No PVCs: no EBS volumes to forget at destroy time. Metrics are lost if a pod restarts, which is
# fine for a session-long demo (export dashboards to monitoring/ and take screenshots).
prometheus:
  prometheusSpec:
    retention: 1d
    storageSpec: {} # emptyDir, no PVC
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1536Mi

grafana:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

# Not needed for the demo: no alert routing is configured. Saves a pod and its memory.
alertmanager:
  enabled: false

# EKS runs the control plane for us, so these endpoints are not scrapeable and would show as
# permanently down targets. kube-proxy on EKS binds metrics to 127.0.0.1, same result.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
